# Publishes installed node_modules to the orphan `devdeps` branch so Claude's
# sandbox (which cannot reach the npm registry) can run the toolchain locally.
# Safe to delete this workflow and the `devdeps` branch at any time.
name: devdeps
on:
  push:
    branches: [v2, "v2-*"]
    paths: [package.json, package-lock.json, .github/workflows/devdeps.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Pack
        run: |
          mkdir -p /tmp/devdeps
          tar -cf - node_modules | zstd -T0 -12 -o /tmp/devdeps/node_modules.tar.zst
          split -b 45m -d /tmp/devdeps/node_modules.tar.zst /tmp/devdeps/nm.part.
          rm /tmp/devdeps/node_modules.tar.zst
          cp package.json package-lock.json /tmp/devdeps/
          echo "${GITHUB_SHA}" > /tmp/devdeps/SOURCE_SHA
          ls -la /tmp/devdeps
      - name: Push orphan branch
        run: |
          cd /tmp/devdeps
          git init -q -b devdeps
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "devdeps for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" devdeps
