name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Owner connection for migrations, seed and test fixtures.
  DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/waymark
  # The app and tests connect as the restricted runtime role.
  RUNTIME_DB_PASSWORD: ci-runtime-password-0000
  DATABASE_URL: postgres://waymark_runtime:ci-runtime-password-0000@localhost:5432/waymark
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  MAIL_DRIVER: outbox
  STORAGE_DRIVER: local
  MALWARE_SCANNER: eicar
  CRON_SECRET: ci-cron
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waymark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: .github/scripts/run.sh "Lint" npm run lint
      - name: Typecheck
        run: .github/scripts/run.sh "Typecheck" npm run typecheck

      - name: Database (migrate, runtime role)
        run: .github/scripts/run.sh "Migrate" bash -c 'DATABASE_URL=$DATABASE_ADMIN_URL npx tsx scripts/migrate.ts && DATABASE_URL=$DATABASE_ADMIN_URL npx tsx scripts/runtime-role.ts'
      - name: Unit and database tests
        run: .github/scripts/run.sh "Unit and DB tests" npx vitest run --coverage

      - name: Build (live)
        run: .github/scripts/run.sh "Build (live)" npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (live)
        run: .github/scripts/run.sh "E2E (live)" bash -c 'npm run e2e:db && npx playwright test'
      - name: E2E (sign-in rate limit)
        run: .github/scripts/run.sh "E2E (rate limit)" npx playwright test --project=desktop -g "rate limited"
        env:
          E2E_SIGNIN_LIMIT: "3"

      - name: Build (demo)
        run: .github/scripts/run.sh "Build (demo)" npm run build:demo
        env:
          NEXT_PUBLIC_BASE_PATH: /waymark
      - name: E2E (demo)
        run: .github/scripts/run.sh "E2E (demo)" npx playwright test
        env:
          E2E_MODE: demo

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
